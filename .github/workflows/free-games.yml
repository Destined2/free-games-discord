name: Free Games Discord Announcements

on:
  schedule:
    # Daily at 10:00 UTC
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  announce-free-games:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run free games bot
        env:
          DISCORD_WEBHOOK_URL_CURRENT: ${{ secrets.DISCORD_WEBHOOK_URL_CURRENT }}
          DISCORD_WEBHOOK_URL_UPCOMING: ${{ secrets.DISCORD_WEBHOOK_URL_UPCOMING }}
        run: python src/main.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted-games.json
          if git diff --cached --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "Update posted free games state"
            git push
          fi
